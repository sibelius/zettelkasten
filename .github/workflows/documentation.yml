name: documentation

on:
  push:
    branches:
      - main
  # A question answered on GitHub Discussions shows up on /ask without a commit.
  discussion:
    types: [created, edited, answered, unanswered, deleted]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so every note shows when it was last updated.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Build website
        run: |
          pnpm install --frozen-lockfile
          node scripts/sync-questions.mjs || echo "questions sync failed, building with the committed ones"
          pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./dist
